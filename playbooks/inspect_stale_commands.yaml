apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: doctor_inspect_stale_commands
  path: doctor/inspect_stale_commands
  description: |
    Inspect a single NoETL execution for stale noetl.command rows.
    Returns the row set and the most recent terminal events that would
    block or unblock the in-process reaper from republishing them.

      noetl run playbooks/inspect_stale_commands.yaml --runtime local \
        --set action=inspect \
        --set execution_id=626611573817082718 \
        --set pg_dsn=postgresql://noetl@localhost:5432/noetl

    Lifecycle verbs: inspect (default), help.

    Implemented with `kind: shell` + `psql` + `jq` so it parses under
    the canonical `noetl run --runtime local` path.

  exposes_as_mcp: true
  tags:
    - doctor
    - runtime-reaper
    - read-only

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: inspect              # inspect, help
  pg_dsn: "postgresql://noetl@localhost:5432/noetl"
  execution_id: 0

workflow:
  - step: start
    desc: Entry point for per-execution stale-command inspection
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          echo "doctor.inspect_stale_commands - action '{{ workload.action }}' execution_id={{ workload.execution_id }}" >&2
    next:
      spec:
        mode: exclusive
      arcs:
        - step: inspect
          when: "{{ workload.action == 'inspect' }}"
        - step: show_help

  - step: inspect
    desc: Pull non-terminal commands + last 5 terminal events for the execution
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          PG_DSN='{{ workload.pg_dsn }}'
          EXECUTION_ID='{{ workload.execution_id }}'

          if [ "${EXECUTION_ID}" = "0" ] || [ -z "${EXECUTION_ID}" ]; then
            jq -n '{status: "error", error: "execution_id is required for action=inspect"}'
            exit 0
          fi

          QUERY=$(cat <<SQL
            WITH cmds AS (
                SELECT
                    c.command_id::text AS command_id,
                    c.event_id,
                    c.step_name AS step,
                    c.status,
                    c.worker_id,
                    c.attempt,
                    c.created_at,
                    c.claimed_at,
                    c.started_at,
                    c.completed_at,
                    r.status    AS worker_status,
                    r.heartbeat AS worker_heartbeat
                FROM noetl.command c
                LEFT JOIN noetl.runtime r
                    ON r.kind = 'worker_pool' AND r.name = c.worker_id
                WHERE c.execution_id = ${EXECUTION_ID}
                  AND c.status IN ('PENDING', 'CLAIMED', 'RUNNING')
                ORDER BY c.created_at
            ),
            term AS (
                SELECT event_type, created_at
                FROM noetl.event
                WHERE execution_id = ${EXECUTION_ID}
                  AND event_type IN (
                      'playbook.completed', 'playbook.failed',
                      'workflow.completed', 'workflow.failed',
                      'execution.cancelled'
                  )
                ORDER BY created_at DESC
                LIMIT 5
            )
            SELECT json_build_object(
              'non_terminal_commands',
                COALESCE((SELECT json_agg(cmds.*) FROM cmds), '[]'::json),
              'terminal_events',
                COALESCE((SELECT json_agg(term.*) FROM term), '[]'::json)
            )::text;
          SQL
          )

          PAYLOAD=$(psql "${PG_DSN}" -A -t -X -c "${QUERY}")
          if [ -z "${PAYLOAD}" ]; then
            PAYLOAD='{"non_terminal_commands":[],"terminal_events":[]}'
          fi

          echo "${PAYLOAD}" | jq \
            --arg execution_id "${EXECUTION_ID}" \
            '{
              status: (
                if ((.non_terminal_commands|length) > 0
                    and (.terminal_events|length) == 0)
                then "stuck" else "ok" end
              ),
              execution_id: ($execution_id|tonumber? // $execution_id),
              execution_terminal: ((.terminal_events|length) > 0),
              terminal_events: .terminal_events,
              non_terminal_commands: .non_terminal_commands,
              non_terminal_command_count: (.non_terminal_commands|length)
            }'
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_help
    desc: Print usage for callers who invoked without a known action
    tool:
      kind: shell
      cmds:
        - |
          echo "Usage:"
          echo "  noetl run playbooks/inspect_stale_commands.yaml --runtime local --set action=<action>"
          echo ""
          echo "Actions: inspect, help"
          echo ""
          echo "Defaults:"
          echo "  pg_dsn={{ workload.pg_dsn }}"
          echo "  execution_id={{ workload.execution_id }}  (required for inspect)"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: Terminal step
    tool:
      kind: shell
      cmds:
        - ":"
