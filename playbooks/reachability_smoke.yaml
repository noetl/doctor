apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: doctor_reachability_smoke
  path: doctor/reachability_smoke
  description: |
    Validate that the NoETL server is reachable over HTTP and that the
    Postgres NoETL database is reachable. Designed for use as a
    Kubernetes liveness/readiness probe runner or as the first step in
    a monitoring-triggered reaper job.

      noetl run playbooks/reachability_smoke.yaml --runtime local \
        --set action=probe \
        --set noetl_server_url=http://localhost:8082 \
        --set pg_dsn=postgresql://noetl@localhost:5432/noetl

    Lifecycle verbs: probe (default), help.

    Everything is `kind: shell` so the playbook parses under the
    canonical `noetl run --runtime local` path, matching the rest of
    `repos/ops`. The doctor Dockerfile bundles `curl`, `psql`, and `jq`.

  exposes_as_mcp: true
  tags:
    - doctor
    - runtime-reaper
    - reachability
  capabilities:
    - reachability-probe

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: probe                 # probe, help
  noetl_server_url: "http://localhost:8082"
  pg_dsn: "postgresql://noetl@localhost:5432/noetl"

workflow:
  - step: start
    desc: Entry point for reachability smoke
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          echo "doctor.reachability_smoke - action '{{ workload.action }}'" >&2
    next:
      spec:
        mode: exclusive
      arcs:
        - step: probe
          when: "{{ workload.action == 'probe' }}"
        - step: show_help

  - step: probe
    desc: Combined server-health + pg-ping + worker-pool snapshot
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          NOETL_URL='{{ workload.noetl_server_url }}'
          PG_DSN='{{ workload.pg_dsn }}'

          # --- NoETL /api/health -------------------------------------
          # -m 10 caps the request at 10s; -o /dev/null silences body;
          # -w prints the HTTP status code we want for the JSON output.
          SERVER_STATUS=$(curl -sS -m 10 -o /dev/null \
                                -w '%{http_code}' \
                                "${NOETL_URL}/api/health" || echo "000")
          if [ "${SERVER_STATUS}" = "200" ]; then
            SERVER_OK=true
          else
            SERVER_OK=false
          fi

          # --- Postgres SELECT 1 -------------------------------------
          if psql "${PG_DSN}" -A -t -X -c "SELECT 1" >/dev/null 2>&1; then
            PG_OK=true
          else
            PG_OK=false
          fi

          # --- Worker pool snapshot ----------------------------------
          # Returns a single JSON object; if psql fails we still want
          # the rest of the report, so trap to a safe default.
          POOL=$(psql "${PG_DSN}" -A -t -X -c "
            SELECT json_build_object(
              'ready_workers',
                COUNT(*) FILTER (WHERE status = 'ready'),
              'non_ready_workers',
                COUNT(*) FILTER (WHERE status != 'ready'),
              'stale_heartbeat_workers',
                COUNT(*) FILTER (
                    WHERE heartbeat < (NOW() - INTERVAL '5 minutes')
                )
            )::text
            FROM noetl.runtime
            WHERE kind = 'worker_pool'" 2>/dev/null || echo '{}')

          if [ -z "${POOL}" ]; then
            POOL='{}'
          fi

          # --- Final Outcome JSON ------------------------------------
          jq -n \
            --arg server_status "${SERVER_STATUS}" \
            --argjson server_ok ${SERVER_OK} \
            --argjson pg_ok ${PG_OK} \
            --argjson pool "${POOL}" \
            '{
              ok: ($server_ok and $pg_ok),
              noetl_server_health: {status_code: ($server_status|tonumber? // 0), ok: $server_ok},
              postgres: {ok: $pg_ok},
              worker_pool: $pool
            }'
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_help
    desc: Print usage for callers who invoked without a known action
    tool:
      kind: shell
      cmds:
        - |
          echo "Usage:"
          echo "  noetl run playbooks/reachability_smoke.yaml --runtime local --set action=<action>"
          echo ""
          echo "Actions: probe, help"
          echo ""
          echo "Defaults:"
          echo "  noetl_server_url={{ workload.noetl_server_url }}"
          echo "  pg_dsn={{ workload.pg_dsn }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: Terminal step
    tool:
      kind: shell
      cmds:
        - ":"
