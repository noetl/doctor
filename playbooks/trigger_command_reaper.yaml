apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: doctor_trigger_command_reaper
  path: doctor/trigger_command_reaper
  description: |
    Ask a running NoETL server to run a single command-reaper sweep
    on demand. The endpoint is idempotent: the in-process reaper is
    still the authority and runs on its own interval; this call is a
    best-effort nudge driven from monitoring/MCP.

      noetl run playbooks/trigger_command_reaper.yaml --runtime local \
        --set action=trigger \
        --set noetl_server_url=http://localhost:8082

    Lifecycle verbs: trigger (default), help.

    Implemented entirely with `kind: shell` + `curl` so it parses
    under the canonical `noetl run --runtime local` path.

  exposes_as_mcp: true
  tags:
    - doctor
    - runtime-reaper
    - repair

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: trigger            # trigger, help
  noetl_server_url: "http://localhost:8082"

workflow:
  - step: start
    desc: Entry point for the reaper-sweep nudge
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          echo "doctor.trigger_command_reaper - action '{{ workload.action }}'" >&2
    next:
      spec:
        mode: exclusive
      arcs:
        - step: nudge
          when: "{{ workload.action == 'trigger' }}"
        - step: show_help

  - step: nudge
    desc: POST /api/admin/command_reaper/sweep (404-tolerant)
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          URL='{{ workload.noetl_server_url }}/api/admin/command_reaper/sweep'

          # Capture both the response body and the trailing status code.
          # `-w '\n%{http_code}'` keeps body+code separable. -m 30 caps
          # the request at 30s; older NoETL versions do not expose the
          # sweep endpoint, so we tolerate a 404 here as `noop`.
          RAW=$(curl -sS -m 30 -X POST \
                      -H 'content-type: application/json' \
                      -d '{}' \
                      -w '\n%{http_code}' \
                      "${URL}" 2>/dev/null || echo $'\n000')

          STATUS=$(printf '%s' "${RAW}" | tail -n1)
          BODY=$(printf '%s' "${RAW}"   | sed '$d')

          case "${STATUS}" in
            200|202)
              jq -n --arg body "${BODY}" --arg code "${STATUS}" \
                '{status: "ok", status_code: ($code|tonumber), body: $body}'
              ;;
            404)
              jq -n --arg code "${STATUS}" \
                '{status: "noop", status_code: ($code|tonumber),
                  note: "admin sweep endpoint not implemented; in-process reaper still runs"}'
              ;;
            *)
              jq -n --arg body "${BODY}" --arg code "${STATUS}" \
                '{status: "error", status_code: ($code|tonumber? // 0), body: $body}'
              ;;
          esac
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_help
    desc: Print usage for callers who invoked without a known action
    tool:
      kind: shell
      cmds:
        - |
          echo "Usage:"
          echo "  noetl run playbooks/trigger_command_reaper.yaml --runtime local --set action=<action>"
          echo ""
          echo "Actions: trigger, help"
          echo ""
          echo "Defaults:"
          echo "  noetl_server_url={{ workload.noetl_server_url }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: Terminal step
    tool:
      kind: shell
      cmds:
        - ":"
