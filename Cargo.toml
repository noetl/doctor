[package]
name = "noetl-doctor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Out-of-process runtime reaper for NoETL. Thin Rust wrapper over the `noetl` CLI that runs healing playbooks in local-runtime mode and exposes an MCP HTTP surface for monitoring-driven repair."
repository = "https://github.com/noetl/doctor"
homepage = "https://noetl.io"
readme = "README.md"
keywords = ["noetl", "workflow", "reaper", "self-healing", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "noetl-doctor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
which = "6.0"
tempfile = "3.10"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "tower-log", "matched-path"] }
tower = { version = "0.4", default-features = false }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
